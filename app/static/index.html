<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookhoard</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
  // apply saved theme before first paint (no flash)
  try { document.documentElement.dataset.theme = localStorage.getItem("bookhoard-theme") || "auto"; } catch (e) {}
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/library">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="5" height="20" rx="1"/><rect x="10.5" y="9" width="4.5" height="17" rx="1"/><rect x="17" y="5" width="4" height="21" rx="1" transform="rotate(-8 19 15)"/><rect x="3" y="26" width="26" height="2.2" rx="1"/></svg>
      <span id="brand-name">Bookhoard</span>
    </a>

    <nav class="nav">
      <a href="#/library" data-nav="library"><i>📚</i>Library <span class="count" id="nav-count"></span></a>
      <a href="#/authors" data-nav="authors"><i>✒</i>Authors</a>
      <a href="#/discover" data-nav="discover"><i>🔎</i>Discover</a>
      <a href="#/downloads" data-nav="downloads"><i>⬇</i>Downloads <span class="badge" id="dl-badge" hidden></span></a>
    </nav>

    <div class="side-section">
      <div class="side-head">
        <a href="#/shelves">Bookshelves</a>
        <button class="icon-btn" id="new-shelf" title="New shelf" aria-label="New shelf">＋</button>
      </div>
      <div id="shelf-list" class="shelf-list"></div>
    </div>

    <div class="side-section">
      <div class="side-head">
        <span>Tags</span>
        <span><button class="icon-btn" id="sync-tags" title="Refresh tags from lubimyczytac.pl" aria-label="Refresh tags from lubimyczytac.pl">⟳</button><button class="icon-btn" id="manage-tags" title="Manage tags" aria-label="Manage tags">✎</button></span>
      </div>
      <div id="tag-cloud" class="tag-cloud"></div>
    </div>

    <div class="side-foot">
      <button class="ghost" id="repair-btn">🛠 Repair library</button>
      <button class="ghost" id="koreader-help">📖 Connect KOReader</button>
      <div class="theme-switch" role="radiogroup" aria-label="Theme">
        <button data-theme-set="light" title="Light">☀</button>
        <button data-theme-set="auto" title="Follow system">Auto</button>
        <button data-theme-set="dark" title="Dark">☾</button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search title, author, series, tag…" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="top-actions">
        <select id="sort" title="Sort">
          <option value="added">Recently added</option>
          <option value="title">Title</option>
          <option value="author">Author (surname)</option>
          <option value="author_first">Author (first name)</option>
          <option value="series">Series</option>
          <option value="rating">Rating</option>
        </select>
        <div class="seg" id="view-toggle">
          <button data-view="grid" title="Grid">▦</button>
          <button data-view="list" title="List">☰</button>
        </div>
        <label class="btn primary" title="Upload books">
          ⇪ <span class="hide-sm">Upload</span>
          <input type="file" id="upload" multiple hidden accept=".epub,.kepub,.mobi,.azw3,.fb2,.pdf,.djvu,.cbz,.txt">
        </label>
      </div>
    </header>

    <section id="view" class="view"></section>
  </main>
</div>

<div class="bulkbar" id="bulkbar" hidden>
  <span id="bulk-count"></span>
  <select id="bulk-shelf"><option value="">Add to shelf…</option></select>
  <button class="ghost" id="bulk-tag">Add tag</button>
  <button class="ghost" id="bulk-sync-tags" title="Refresh tags of the selected books from lubimyczytac.pl">Refresh tags</button>
  <button class="ghost" id="bulk-merge" title="Combine the selected books into one entry with several files">Merge</button>
  <button class="ghost" id="bulk-clear">Clear</button>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-panel" id="drawer-panel" role="dialog" aria-modal="true"></div>
</div>

<dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>

<div class="dropzone" id="dropzone"><div>Drop books to add them to your library</div></div>
<div class="toasts" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
